zerops:
  - setup: placeshare-backend
    build:
      base: python@3.12
      buildCommands:
        - cd backend && pip install -r requirements.txt
      deployFiles:
        - backend
    run:
      base: python@3.12
      initCommands:
        - cd backend && alembic upgrade head
      start: cd backend && uvicorn app.main:app --host 0.0.0.0 --port 8000
      envVariables:
        PYTHONUNBUFFERED: 1
        DEBUG: "False"

  - setup: placeshare-frontend
    build:
      base: nodejs@20
      buildCommands:
        - cd frontend && npm ci
        - cd frontend && npm run build
      deployFiles:
        - frontend/dist/~
    run:
      base: static
