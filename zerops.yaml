zerops:
  - setup: backend
    build:
      base: python@3.12
      buildCommands:
        - cd backend && pip install --target=./vendor -r requirements.txt
      deployFiles:
        - backend/~
    run:
      base: python@3.12
      envVariables:
        PYTHONPATH: /var/www:/var/www/vendor
        PYTHONUNBUFFERED: "1"
        DEBUG: "False"
      initCommands:
        - python -m alembic upgrade head
      start: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
      ports:
        - port: 8000
          httpSupport: true

  - setup: frontend
    build:
      base: nodejs@20
      envVariables:
        VITE_API_URL: https://backend-2a96-8000.prg1.zerops.app
      buildCommands:
        - cd frontend && npm ci
        - cd frontend && npm run build
      deployFiles:
        - frontend/dist/~
    run:
      base: static
