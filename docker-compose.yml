version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: placeshare-db
    restart: always
    environment:
      POSTGRES_USER: placeshare_user
      POSTGRES_PASSWORD: placeshare_password
      POSTGRES_DB: placement
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U placeshare_user -d placement"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend
    container_name: placeshare-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://placeshare_user:placeshare_password@db:5432/placement
      - SECRET_KEY=super-secret-production-key-change-me
      - CORS_ORIGINS=["http://localhost", "http://localhost:80", "http://localhost:3000"]
      - DEBUG=False
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
    container_name: placeshare-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
