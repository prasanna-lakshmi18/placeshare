zerops:
  - setup: backend
    build:
      base: python@3.12
      buildCommands:
        - cd backend && python -m venv venv && ./venv/bin/pip install --upgrade pip && ./venv/bin/pip install -r requirements.txt
      deployFiles:
        - backend
    run:
      base: python@3.12
      envVariables:
        PYTHONUNBUFFERED: 1
        DEBUG: "False"
        PATH: /var/www/backend/venv/bin:$PATH
      initCommands:
        - cd backend && ./venv/bin/python -m alembic upgrade head
      start: cd backend && ./venv/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port 8000

  - setup: frontend
    build:
      base: nodejs@20
      buildCommands:
        - cd frontend && npm ci
        - cd frontend && npm run build
      deployFiles:
        - frontend/dist/~
    run:
      base: static
