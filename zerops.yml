zerops:
  - setup: backend
    build:
      base: python@3.12
      buildCommands:
        - cd backend && pip install --target=./vendor -r requirements.txt
      deployFiles:
        - backend
    run:
      base: python@3.12
      envVariables:
        PYTHONPATH: /var/www/backend:/var/www/backend/vendor
        PATH: /var/www/backend/vendor/bin:$PATH
        PYTHONUNBUFFERED: 1
        DEBUG: "False"
      initCommands:
        - cd backend && /var/www/backend/vendor/bin/alembic upgrade head
      start: cd backend && /var/www/backend/vendor/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000
      ports:
        - port: 8000
          httpSupport: true

  - setup: frontend
    build:
      base: nodejs@20
      buildCommands:
        - cd frontend && npm ci
        - cd frontend && npm run build
      deployFiles:
        - frontend/dist/~
    run:
      base: static
